<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - SmartReport</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f8f9fa, #dce3ea);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .reset-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 380px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      margin-top: 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background-color: #218838;
    }

    .back-link {
      display: block;
      margin-top: 15px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="reset-container">
    <h2>Set New Password</h2>
    <form id="resetForm">
      <input type="password" name="newPassword" placeholder="Enter new password" required>
      <button type="submit">Update Password</button>
    </form>
    <a class="back-link" href="adminlogin page.html">← Back to Login</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token");

  document.getElementById('resetForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const newPassword = this.newPassword.value;

    fetch('http://localhost:8080/api/authority/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.message.includes("success")) {
        window.location.href = "adminlogin page.html"; 
      }
    })
    .catch(err => {
      console.error(err);
      alert("Something went wrong. Please try again.");
    });
  });
  </script>

</body>
</html>
