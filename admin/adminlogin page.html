<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SmartReport</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

/* --- Global Reset & Animations --- */
* {
    box-sizing: border-box;
}

@keyframes slideUpFade {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    background-color: #f0f4f8; /* Main page background se match karta hua */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
}

/* --- 🌟 Premium Glass/Card Container --- */
.login-container {
    background-color: #ffffff;
    padding: 50px 40px;
    border-radius: 24px; /* Modern round corners */
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08); /* Deep soft shadow */
    border: 1px solid #f1f5f9;
    animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; /* Smooth entry */
}

h2 {
    margin-top: 0;
    margin-bottom: 30px;
    color: #0f172a;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
}

/* --- Form Inputs (Clean & Bubbly) --- */
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 18px;
    border-radius: 14px;
    border: 2px solid #e2e8f0;
    background-color: #f8fafc;
    font-size: 15px;
    font-family: inherit;
    color: #1e293b;
    transition: all 0.3s ease;
}

/* Smooth Focus Glow */
input[type="email"]:focus,
input[type="password"]:focus {
    outline: none;
    border-color: #3b82f6;
    background-color: #ffffff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}

/* --- 🌟 Primary Gradient Action Button --- */
button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%); /* Premium Indigo-Blue */
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
}

button:active {
    transform: translateY(1px) scale(0.98); /* Tactile Click */
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
}

/* --- Links (Forgot Password / Create Account) --- */
.link-container {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.link-container a {
    font-size: 14px;
    color: #64748b;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.link-container a:hover {
    color: #3b82f6; /* Subtle hover color change, no crazy boxes */
}

/* --- Error Message Styling --- */
.error-message {
    background-color: #fef2f2; /* Soft red background */
    color: #ef4444; /* Clean red text */
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 20px;
    border: 1px solid #fecaca;
    display: none; /* JS handle karega */
}
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
       <div class="link-container">
        <a href="create.html">Create an account</a>
        <a href="forget.html">Forgot Password?</a>
      </div>

      <div class="error-message" id="errorMsg">Invalid credentials. Please try again.</div>
    </form>
  </div>

  <script>
document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Prepare payload exactly with keys email & password
      fetch("http://localhost:8080/api/authority/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })
      .then(res => {
        if (res.status === 200) {
          return res.json();
        } else {
          throw new Error("Unauthorized");
        }
      })
      .then(data => {
        // login successful
        alert("login succesfully");
        window.location.href = "admin dashboard.html";
      })
      .catch(() => {
        document.getElementById("errorMsg").style.display = "block";
      });
    });

    
  </script>
   
</body>
</html>
