<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SmartReport</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #80cbc4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: rgb(128, 214, 231);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
       transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 2px 4px 6px rgba(49, 13, 156, 0.1);
    }
    .login-container:hover{
       background-color: #70c3a9;
          transform: scale(1.05);
      /* Add a glowing shadow effect */
      box-shadow: 0 0 20px rgba(8, 23, 120, 0.6);
    }

    h2 {
      margin-bottom: 20px;
      color: #004d40;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #8076d7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
       transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 2px 4px 6px rgba(49, 13, 156, 0.1);
    }

    button:hover {
     background-color: #5f72c1;
          transform: scale(1.05);
      /* Add a glowing shadow effect */
      box-shadow: 0 0 20px rgba(229, 15, 15, 0.6);
    }

    .error-message {
      color: red;
      margin-top: 10px;
      display: none;
    }
     .link-container {
      margin-top: 17px;
      display: flex;
      justify-content: space-between;
    }

    .link-container a {
      font-size: 17px;
      color: #e3103e;
      text-decoration: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 2px 4px 6px rgba(49, 13, 156, 0.1);
    }

    .link-container a:hover {
      border-radius: 10px;
       background-color: #707ec3;
          transform: scale(1.05);
      /* Add a glowing shadow effect */
      box-shadow: 0 0 20px rgba(8, 23, 120, 0.6);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
       <div class="link-container">
        <a href="create.html">Create an account</a>
        <a href="forget.html">Forgot Password?</a>
      </div>

      <div class="error-message" id="errorMsg">Invalid credentials. Please try again.</div>
    </form>
  </div>

  <script>
document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Prepare payload exactly with keys email & password
      fetch("http://localhost:8080/api/authority/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })
      .then(res => {
        if (res.status === 200) {
          return res.json();
        } else {
          throw new Error("Unauthorized");
        }
      })
      .then(data => {
        // login successful
        alert("login succesfully");
        window.location.href = "admin dashboard.html";
      })
      .catch(() => {
        document.getElementById("errorMsg").style.display = "block";
      });
    });

    
  </script>
   
</body>
</html>
